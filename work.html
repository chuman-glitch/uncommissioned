<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · uncommissioned</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=14">
<style>
/* a record card beside an image viewer */
.sheet{display:grid;grid-template-columns:minmax(320px,5fr) 7fr;height:calc(100svh - 34px);min-height:560px;max-height:900px;border-bottom:1px solid var(--line-2)}
.card{position:relative;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;overflow:auto}
.cells{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid currentColor}
.cells div{padding:7px 10px 9px;border-left:1px solid currentColor;font-size:12px;line-height:1.3}
.cells div:first-child{border-left:0}
.cells span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-bottom:2px}
.card .main{padding:clamp(22px,3vw,44px) clamp(16px,1.8vw,26px) 18px;flex:1}
.card h1 .fm{font-style:normal;vertical-align:.6em}
.card h1{font-family:var(--serif);font-size:clamp(30px,3vw,50px);line-height:1.04;letter-spacing:-.01em;font-weight:400;font-style:italic}
.card .by{font-size:clamp(16px,1.3vw,19px);margin-top:12px;font-weight:500}
.card .by small{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:2px}
.card dl{margin-top:clamp(22px,3vw,40px);font-size:13.5px;line-height:1.4}
.card dl div{display:grid;grid-template-columns:96px 1fr;gap:12px;border-top:1px solid currentColor;padding:7px 0 8px}
.card dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;padding-top:2px}
.card .fn{margin:20px 0 0 auto;max-width:250px}
.btns{display:flex;gap:6px;padding:10px clamp(16px,1.8vw,26px) 14px;flex-wrap:wrap}
.btns a{border:1px solid currentColor;border-radius:99px;padding:4px 12px 5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;transition:background .15s,color .15s}
.btns a:hover{background:var(--accent-ink);color:var(--accent)}
.viewer{position:relative;background:#252523;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;flex:1;min-height:0;cursor:e-resize}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.stage img.on{opacity:1}
.vbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 12px;border-top:1px solid var(--line-2);font-size:12px}
.vbar button{padding:2px 8px;border:1px solid var(--line-2);font-size:12px}
.vbar button:hover{background:var(--fg);color:var(--bg)}
.loc{position:absolute;right:12px;bottom:12px;width:150px;background:rgba(37,37,35,.88);border:1px solid var(--line-2);padding:6px}
.loc svg{display:block;width:100%;height:auto}
.loc p{font-size:10.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.after{grid-column:1/8}
.after-r{grid-column:9/-1}
.tl{border-top:1px solid var(--line-2)}
.tl a{display:block;padding:10px 0 12px;border-bottom:1px solid var(--line-2)}
.tl a:hover{color:var(--accent)}
.tl .o{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.tl .h{font-family:var(--serif);font-size:19px;line-height:1.25;margin-top:2px}
@media (max-width:860px){
  .sheet{grid-template-columns:1fr;height:auto;max-height:none}
  .viewer{order:-1}
  .stage{aspect-ratio:4/3}
  .loc{width:110px}
  .after,.after-r{grid-column:1/-1}
  .after-r{margin-top:36px}
}
</style>
</head>
<body>
<main id="main"></main>

<script src="assets/data.js?v=14"></script>
<script src="assets/site.js?v=14"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const pages = WORKS.filter(hasPage);
const w = pages.find(x => x.id === qs("w")) || pages[0];
const E = EDITIONS[w.ed];
setAccent(w.color);
header("Edition " + w.ed);
document.title = `${w.artist}, ${w.title} · uncommissioned`;
const i = pages.indexOf(w), prev = pages[(i - 1 + pages.length) % pages.length], next = pages[(i + 1) % pages.length];
const texts = TEXTS.filter(x => x.work === w.id);
const catNo = cat(w);
const coords = `${Math.abs(w.lat).toFixed(2)}° ${w.lat >= 0 ? "N" : "S"}, ${Math.abs(w.lon).toFixed(2)}° ${w.lon >= 0 ? "E" : "W"}`;

document.getElementById("main").innerHTML = `
  <section class="sheet">
    <div class="card">
      <div class="cells">
        <div><span>Cat.</span>${catNo}</div>
        <div><span>Edition</span>${w.ed}</div>
        <div><span>Year</span>${w.year}</div>
        <div><span>${w.from ? "From" : "Country"}</span>${esc(w.from || w.country)}</div>
      </div>
      <div class="main">
        <h1>${esc(w.title)}${w.note ? fm(1) : ""}</h1>
        <p class="by">${esc(w.artist)}${w.sub ? `<small>${esc(w.sub)}</small>` : ""}</p>
        <dl>
          <div><dt>Type</dt><dd>${t(w.type || (w.medium || []).join(", "))}</dd></div>
          ${w.materials ? `<div><dt>Materials</dt><dd>${t(w.materials)}</dd></div>` : ""}${w.thread ? `<div><dt>Thread</dt><dd>${w.thread.join(", ")}</dd></div>` : ""}
          <div><dt>Site</dt><dd>${esc(w.place.startsWith(w.site) ? w.place : w.site + ", " + w.place)}</dd></div>
          <div><dt>Coordinates</dt><dd>${coords} <span style="opacity:.6">approx.</span></dd></div>
          <div><dt>Edition</dt><dd>${E.title}, ${E.when}</dd></div>
        </dl>
        ${w.note ? `<div class="fn" data-n="1"><b>Note</b>${t(w.note)}</div>` : ""}
      </div>
    </div>
    <div class="viewer">
      <div class="stage" id="stage">${w.imgs.map((f, k) => `<img src="img/${f}" alt="${esc(w.artist)}, ${esc(w.title)}, view ${k + 1}"${k ? ' loading="lazy"' : ""}>`).join("")}
        <div class="loc" id="loc"><p>${esc(w.place)}</p></div>
      </div>
      <div class="vbar">
        <span class="dim">Fig. <span id="fig">1</span>. ${esc(w.artist)}, <i>${esc(w.title)}</i>, ${w.year}</span>
        <span>${w.imgs.length > 1 ? `<button type="button" id="pv">←</button> <span id="ct">1</span> / ${w.imgs.length} <button type="button" id="nx">→</button>` : "1 / 1"}</span>
      </div>
    </div>
  </section>

  <div class="space-l"></div>

  <section class="pg grid">
    <div class="after">
      <p class="t-meta caps">Cite as</p>
      <p class="t-body" style="margin-top:6px">${esc(w.artist)}, <i>${esc(w.title)}</i>, ${w.year}. <i>uncommissioned</i>, Edition ${w.ed}, cat. ${catNo}. Nōvo Collective. uncommissioned.art/work/${w.id}</p>
    </div>
    <div class="after-r">
      <p class="t-meta caps" style="margin-bottom:8px">Writing on this work</p>
      ${texts.length ? `<div class="tl">${texts.map(x => `<a href="${x.url}" target="_blank" rel="noopener"><div class="o">${esc(x.outlet)}, ${x.date}</div><div class="h">${esc(x.title)} ↗</div></a>`).join("")}</div>` : `<p class="t-body dim">None yet.</p>`}
    </div>
  </section>

  <div class="space-l"></div>
  ${blocks([
    {href:workURL(prev), color:prev.color, k:"← Previous · " + cat(prev), h:esc(prev.title), s:esc(prev.artist)},
    {href:"edition.html?e=" + w.ed, color:E.color, plain:true, k:"↑ Back to Edition " + w.ed, h:E.title, s:"All " + figures(w.ed).works + " works"},
    {href:workURL(next), color:next.color, k:"Next · " + cat(next) + " →", h:esc(next.title), s:esc(next.artist)}
  ])}`;

footer();

/* image viewer */
const ims = document.querySelectorAll("#stage img"); let k = 0;
const show = n => { k = (n + ims.length) % ims.length; ims.forEach((im, j) => im.classList.toggle("on", j === k)); const ct = document.getElementById("ct"); if (ct) ct.textContent = k + 1; document.getElementById("fig").textContent = k + 1; };
show(0);
document.getElementById("stage").addEventListener("click", e => { if (!e.target.closest(".loc")) show(k + 1); });
document.getElementById("pv")?.addEventListener("click", () => show(k - 1));
document.getElementById("nx")?.addEventListener("click", () => show(k + 1));
addEventListener("keydown", e => { if (e.key === "ArrowRight") show(k + 1); if (e.key === "ArrowLeft") show(k - 1); });

/* locator */
(async () => {
  const el = document.getElementById("loc");
  const svg = d3.select(el).insert("svg", ":first-child").attr("viewBox", "0 0 300 200");
  const isCur = w.ed === "02";
  const topo = await fetch(isCur ? COUNTRIES10 : LAND).then(r => r.json());
  const land = isCur ? {type:"FeatureCollection", features: topojson.feature(topo, topo.objects.countries).features.filter(f => /Cura/.test(f.properties.name))}
                     : topojson.feature(topo, topo.objects.land);
  const proj = isCur
    ? d3.geoMercator().fitExtent([[14,14],[286,186]], {type:"MultiPoint", coordinates:[[-69.17,12.40],[-68.62,11.96]]})
    : d3.geoMercator().center([w.lon, w.lat]).scale(420).translate([150, 100]);
  svg.append("path").attr("class", "land").attr("d", d3.geoPath(proj)(land));
  const [x, y] = proj([w.lon, w.lat]);
  svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 7).attr("fill", col(w.color).bg).attr("stroke", "#fff").attr("stroke-width", 2);
})().catch(() => {});
</script>
</body>
</html>
