<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f2f2d">
<title>Work · uncommissioned</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=17">
<style>
/* a record card beside an image viewer */
.sheet{display:grid;grid-template-columns:minmax(320px,5fr) 7fr;height:calc(100svh - 34px);min-height:560px;max-height:900px;border-bottom:1px solid var(--line-2)}
.card{position:relative;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;overflow:auto}
.cells{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid currentColor}
.cells div{padding:7px 10px 9px;border-left:1px solid currentColor;font-size:12px;line-height:1.3}
.cells div:first-child{border-left:0}
.cells span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-bottom:2px}
.card .main{padding:clamp(22px,3vw,44px) clamp(16px,1.8vw,26px) 18px;flex:1}
.strip{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:9px var(--pad);border-bottom:1px solid var(--line-2)}
.strip .t-meta{color:var(--fg)}
.strip a{text-decoration:underline;text-underline-offset:2px}
.gap{height:clamp(28px,4vw,56px)}
.card h1 .fm{font-style:normal;vertical-align:.6em}
.card h1{font-family:var(--serif);font-size:clamp(30px,3vw,50px);line-height:1.04;letter-spacing:-.01em;font-weight:400;font-style:italic}
.card .by{font-size:clamp(16px,1.3vw,19px);margin-top:12px;font-weight:500}
.card .by small{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:2px}
.card dl{margin-top:clamp(22px,3vw,40px);font-size:13.5px;line-height:1.4}
.card dl div{display:grid;grid-template-columns:96px 1fr;gap:12px;border-top:1px solid currentColor;padding:7px 0 8px}
.card dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.65;padding-top:2px}
.card .fn{margin:20px 0 0 auto;max-width:250px}
.btns{display:flex;gap:6px;padding:10px clamp(16px,1.8vw,26px) 14px;flex-wrap:wrap}
.btns a{border:1px solid currentColor;border-radius:99px;padding:4px 12px 5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;transition:background .15s,color .15s}
.btns a:hover{background:var(--accent-ink);color:var(--accent)}
.viewer{position:relative;background:#252523;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;flex:1;min-height:0;cursor:e-resize}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.stage img.on{opacity:1}
.vbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 12px;border-top:1px solid var(--line-2);font-size:12px}
.vbar button{padding:2px 8px;border:1px solid var(--line-2);font-size:12px}
.vbar button:hover{background:var(--fg);color:var(--bg)}
.loc{position:absolute;right:12px;bottom:12px;width:150px;background:rgba(37,37,35,.88);border:1px solid var(--line-2);padding:6px}
.loc svg{display:block;width:100%;height:auto}
.loc p{font-size:10.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.after{grid-column:1/8}
.after-r{grid-column:9/-1}
.tl{border-top:1px solid var(--line-2)}
.tl a{display:block;padding:10px 0 12px;border-bottom:1px solid var(--line-2)}
.tl a:hover{color:var(--accent)}
.tl .o{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.tl .h{font-family:var(--serif);font-size:19px;line-height:1.25;margin-top:2px}
@media (max-width:860px){
  .sheet{grid-template-columns:1fr;height:auto;max-height:none}
  .viewer{order:-1}
  .stage{aspect-ratio:4/3}
  .loc{width:110px}
  .after,.after-r{grid-column:1/-1}
  .after-r{margin-top:36px}
}
</style>
</head>
<body>
<main id="main"></main>

<script src="assets/data.js?v=17"></script>
<script src="assets/site.js?v=17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* one page per artist and edition: an artist with two works (Avantia Damberg,
   Edition 02) gets both on the same page, one record sheet each */
const pages = WORKS.filter(hasPage);
const req = pages.find(x => x.id === qs("w")) || pages[0];
const entries = pages.filter((x, i) => pages.findIndex(y => y.ed === x.ed && y.artist === x.artist) === i);
const group = pages.filter(x => x.ed === req.ed && x.artist === req.artist);
const w = group[0];
const E = EDITIONS[w.ed];
setAccent(w.color);
header("Edition " + w.ed);
document.title = `${w.artist}, ${group.map(x => x.title).join(" / ")} · uncommissioned`;
const i = entries.indexOf(w), prev = entries[(i - 1 + entries.length) % entries.length], next = entries[(i + 1) % entries.length];
const texts = TEXTS.filter(x => group.some(g => x.work === g.id) || x.artist === w.artist);
const credFor = (x, f) => { const k = Object.keys(IMG_CREDITS).find(p => f.split("/").pop().startsWith(p)); return k ? IMG_CREDITS[k] : (x.credit || ""); };
const pics = x => x.imgs && x.imgs.length ? x.imgs.map(f => "img/" + f) : (x.thumb ? [x.thumb] : []);
const coords = x => `${Math.abs(x.lat).toFixed(2)}° ${x.lat >= 0 ? "N" : "S"}, ${Math.abs(x.lon).toFixed(2)}° ${x.lon >= 0 ? "E" : "W"}`;

const sheet = (x, n) => `
  <section class="sheet" id="w-${x.id}" style="${cvars(x.color)};--accent:${col(x.color).bg};--accent-ink:${col(x.color).ink}">
    <div class="card">
      <div class="cells">
        <div><span>Cat.</span>${cat(x)}</div>
        <div><span>Edition</span>${x.ed}</div>
        <div><span>Year</span>${x.year}</div>
        <div><span>${x.from ? "From" : "Country"}</span>${esc(x.from || x.country)}</div>
      </div>
      <div class="main">
        <h1>${esc(x.title)}${x.note ? fm(n + 1) : ""}</h1>
        <p class="by">${esc(x.artist)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</p>
        <dl>
          <div><dt>Type</dt><dd>${t(x.type || (x.medium || []).join(", "))}</dd></div>
          ${x.materials ? `<div><dt>Materials</dt><dd>${t(x.materials)}</dd></div>` : ""}${x.thread ? `<div><dt>Thread</dt><dd>${x.thread.join(", ")}</dd></div>` : ""}
          <div><dt>Site</dt><dd>${esc([x.site, ...x.place.split(", ").filter(p => !x.site.includes(p))].join(", "))}</dd></div>
          <div><dt>Coordinates</dt><dd>${coords(x)} <span style="opacity:.6">approx.</span></dd></div>
          <div><dt>Edition</dt><dd>${E.title}, ${E.when}</dd></div>
        </dl>
        ${x.note ? `<div class="fn" data-n="${n + 1}"><b>Note</b>${t(x.note)}</div>` : ""}
      </div>
    </div>
    <div class="viewer">
      <div class="stage" data-k="${n}">${pics(x).map((f, k) => `<img src="${f}" data-cr="${esc(credFor(x, f))}" alt="${esc(x.artist)}, ${esc(x.title)}, view ${k + 1}"${k ? ' loading="lazy"' : ""}>`).join("")}
        <div class="loc" data-id="${x.id}"><p>${esc(x.place)}</p></div>
      </div>
      <div class="vbar">
        <span class="dim">Fig. <span class="fig">1</span>. ${esc(x.artist)}, <i>${esc(x.title)}</i>, ${x.year}<span class="cr"></span></span>
        <span>${pics(x).length > 1 ? `<button type="button" class="pv">←</button> <span class="ct">1</span> / ${pics(x).length} <button type="button" class="nx">→</button>` : "1 / 1"}</span>
      </div>
    </div>
  </section>`;

document.getElementById("main").innerHTML = `
  ${group.length > 1 ? `<div class="strip pg"><span class="t-meta">${esc(w.artist)}</span><span class="t-meta">${group.length} works in Edition ${w.ed}: ${group.map(x => `<a href="#w-${x.id}">${esc(x.title)}</a>`).join(" · ")}</span></div>` : ""}
  ${group.map(sheet).join('<div class="gap"></div>')}

  <div class="space-l"></div>

  <section class="pg grid">
    <div class="after">
      <p class="t-meta caps">Cite as</p>
      ${group.map(x => `<p class="t-body" style="margin-top:6px">${esc(x.artist)}, <i>${esc(x.title)}</i>, ${x.year}. <i>uncommissioned</i>, Edition ${x.ed}, cat. ${cat(x)}. Nōvo Collective. uncommissioned.art/work/${x.id}</p>`).join("")}
    </div>
    <div class="after-r">
      <p class="t-meta caps" style="margin-bottom:8px">Writing on this work</p>
      ${texts.length ? `<div class="tl">${texts.map(x => `<a href="${x.url}" target="_blank" rel="noopener"><div class="o">${esc(x.outlet)}, ${x.date}</div><div class="h">${esc(x.title)} ↗</div></a>`).join("")}</div>` : `<p class="t-body dim">None yet.</p>`}
    </div>
  </section>

  <div class="space-l"></div>
  ${blocks([
    {href:workURL(prev), color:prev.color, k:"← Previous · " + cat(prev), h:esc(prev.title), s:esc(prev.artist)},
    {href:"edition.html?e=" + w.ed, color:E.color, plain:true, k:"↑ Back to Edition " + w.ed, h:E.title, s:"All " + figures(w.ed).works + " works"},
    {href:workURL(next), color:next.color, k:"Next · " + cat(next) + " →", h:esc(next.title), s:esc(next.artist)}
  ])}`;

footer();
if (req !== w) document.getElementById("w-" + req.id)?.scrollIntoView();

/* image viewers, one per sheet */
const viewers = [...document.querySelectorAll(".sheet")].map(sh => {
  const ims = sh.querySelectorAll(".stage img"); let k = 0;
  const show = n => { k = (n + ims.length) % ims.length; ims.forEach((im, j) => im.classList.toggle("on", j === k)); const ct = sh.querySelector(".ct"); if (ct) ct.textContent = k + 1; sh.querySelector(".fig").textContent = k + 1; const c = ims[k]?.dataset.cr; sh.querySelector(".cr").textContent = c ? ". " + c : ""; };
  show(0);
  sh.querySelector(".stage").addEventListener("click", e => { if (!e.target.closest(".loc")) show(k + 1); });
  sh.querySelector(".pv")?.addEventListener("click", () => show(k - 1));
  sh.querySelector(".nx")?.addEventListener("click", () => show(k + 1));
  return {sh, step: d => show(k + d)};
});
/* arrow keys drive the sheet most in view */
addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const v = viewers.reduce((a, b) => Math.abs(b.sh.getBoundingClientRect().top) < Math.abs(a.sh.getBoundingClientRect().top) ? b : a);
  v.step(e.key === "ArrowRight" ? 1 : -1);
});

/* locators */
(async () => {
  const isCur = w.ed === "02";
  const topo = await fetch(isCur ? COUNTRIES10 : LAND).then(r => r.json());
  const land = isCur ? {type:"FeatureCollection", features: topojson.feature(topo, topo.objects.countries).features.filter(f => /Cura/.test(f.properties.name))}
                     : topojson.feature(topo, topo.objects.land);
  document.querySelectorAll(".loc").forEach(el => {
    const x = WORKS.find(y => y.id === el.dataset.id);
    const svg = d3.select(el).insert("svg", ":first-child").attr("viewBox", "0 0 300 200");
    const proj = isCur
      ? d3.geoMercator().fitExtent([[14,14],[286,186]], {type:"MultiPoint", coordinates:[[-69.17,12.40],[-68.62,11.96]]})
      : d3.geoMercator().center([x.lon, x.lat]).scale(420).translate([150, 100]);
    svg.append("path").attr("class", "land").attr("d", d3.geoPath(proj)(land));
    const [px, py] = proj([x.lon, x.lat]);
    svg.append("circle").attr("cx", px).attr("cy", py).attr("r", 7).attr("fill", col(x.color).bg).attr("stroke", "#fff").attr("stroke-width", 2);
  });
})().catch(() => {});
</script>
</body>
</html>
